version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-sulcapit
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: sulcapit_sulcapital
    ports:
      - "3308:3306"
    volumes:
      - mysql_sulcapit_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_sulcapit_data:
